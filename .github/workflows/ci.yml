name: CI

on:
  push:
    branches:
      - dev
      - stage
  pull_request:
    branches:
      - dev
      - stage

jobs:
  php-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check forbidden tracked files
        shell: bash
        run: |
          set -e

          if git ls-files | grep -E '(^|/)config\.php$'; then
            echo "ERROR: config.php must not be committed."
            exit 1
          fi

          if git ls-files | grep -E '\.(bak|old|tmp|v55|v57bak)$|(^|/)test\.php$'; then
            echo "ERROR: backup/test files must not be committed."
            exit 1
          fi

      - name: PHP syntax check
        shell: bash
        run: |
          set -e

          files=$(git ls-files '*.php' | grep -vE '(^|/)config\.php$' || true)

          if [ -z "$files" ]; then
            echo "No PHP files found."
            exit 0
          fi

          echo "$files" | while read file; do
            php -l "$file"
          done

      - name: Check SQL folder
        shell: bash
        run: |
          test -d sql